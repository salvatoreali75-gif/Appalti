<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Appalti">
<meta name="theme-color" content="#0E7C86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light dark;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Appalti Pulizie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: una colonna da telefono. In alto i totali della ditta, poi una scheda per pulitore con la tabella dei suoi condomini (ricavo, stipendio, utile) e, in fondo, i condomini non assegnati. */
:root {
  --bg: #EEF3F2;
  --surface: #FFFFFF;
  --surface2: #F3F8F7;
  --ink: #12292B;
  --muted: #587072;
  --line: #D3DFDE;
  --accent: #0E7C86;
  --accent-ink: #FFFFFF;
  --bad: #B3392B;
  --good: #1F7A4D;
  --scrim: rgba(10, 24, 26, 0.5);
  --font-display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1819;
    --surface: #14262A;
    --surface2: #19302F;
    --ink: #E5F0EF;
    --muted: #8FA8A8;
    --line: #25403F;
    --accent: #3CC0C9;
    --accent-ink: #062226;
    --bad: #FF8A7A;
    --good: #5CD19A;
    --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1819;
  --surface: #14262A;
  --surface2: #19302F;
  --ink: #E5F0EF;
  --muted: #8FA8A8;
  --line: #25403F;
  --accent: #3CC0C9;
  --accent-ink: #062226;
  --bad: #FF8A7A;
  --good: #5CD19A;
  --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.4;
  padding-block: 14px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
body.lock { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.top > div { min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; line-height: 1.05; letter-spacing: -0.02em; margin: 0; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; }
.btn {
  white-space: nowrap;
  border: 0;
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 700;
  border-radius: 12px;
  padding: 0 16px;
  min-height: 44px;
}
.btn:active { transform: translateY(1px); }
.btn.block { width: 100%; }
.ghost {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink);
  font-weight: 600;
  border-radius: 10px;
  padding: 0 12px;
  min-height: 36px;
  font-size: 0.85rem;
}
.ghost.danger { color: var(--bad); }
.ghost.block { width: 100%; min-height: 44px; font-size: 0.95rem; }

.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.stat { min-width: 0; padding: 8px 10px; border-radius: 12px; }
.stat.main { background: var(--surface2); }
.stat span { display: block; font-size: 0.72rem; color: var(--muted); margin-bottom: 2px; }
.stat b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat.main b { font-size: 1.3rem; font-weight: 800; }
.neg { color: var(--bad); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.card.loose { border-style: dashed; background: transparent; }
.chead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px 8px; }
.chead h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; line-height: 1.15; margin: 0; overflow-wrap: anywhere; }
.chead > div { min-width: 0; }
.meta { margin: 2px 0 0; font-size: 0.8rem; color: var(--muted); }
.none { margin: 0; padding: 4px 14px 12px; color: var(--muted); font-size: 0.9rem; }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; }
th { font-size: 0.66rem; font-weight: 600; color: var(--muted); text-align: right; padding: 6px 2px; border-top: 1px solid var(--line); }
th.l { text-align: left; padding-left: 14px; }
td { padding: 4px 2px; white-space: nowrap; border-top: 1px solid var(--line); text-align: right; font-size: 0.76rem; vertical-align: middle; }
td.nm { text-align: left; padding-left: 14px; white-space: normal; }
td.u { font-weight: 700; }
td.x { padding: 0 6px 0 0; text-align: center; }
col.c-n { width: 56px; }
col.c-x { width: 32px; }
.rowbtn { background: none; border: 0; padding: 8px 0; text-align: left; font-weight: 600; font-size: 0.84rem; line-height: 1.25; width: 100%; overflow-wrap: break-word; }
.xbtn { width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); font-size: 1.25rem; line-height: 1; }
.xbtn:active { background: var(--surface2); }
tr.clk { cursor: pointer; }
tr.clk:active td { background: var(--surface2); }
tr.tot td { background: var(--surface2); font-weight: 700; padding-block: 9px; }
.addrow { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--accent); font-weight: 700; padding: 13px 14px; text-align: left; }

.loose .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
.loose .row .t { min-width: 0; }
.loose .row b { display: block; font-size: 0.92rem; overflow-wrap: anywhere; }
.loose .row small { color: var(--muted); font-variant-numeric: tabular-nums; }

.empty { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 18px; display: flex; flex-direction: column; gap: 10px; }
.empty h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1.15; margin: 0; }
.empty p { margin: 0; color: var(--muted); }
.note { margin: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface2); font-size: 0.85rem; color: var(--muted); }
.foot { display: flex; justify-content: center; padding-top: 6px; }

.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 21;
  margin: 0 auto;
  max-width: 560px;
  max-height: 92dvh;
  overflow-y: auto;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  padding-top: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.sheet > * { flex-shrink: 0; }
.sheet h3 { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1.1; margin: 0; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.field input, .field select {
  font-size: 16px;
  padding: 11px 12px;
  min-height: 46px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg);
  width: 100%;
}
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.prev { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--surface2); font-size: 0.92rem; }
.prev b { font-variant-numeric: tabular-nums; }
.err { margin: 0; color: var(--bad); font-size: 0.85rem; font-weight: 600; }
.hint { margin: 0; font-size: 0.78rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips p { width: 100%; margin: 0; font-size: 0.8rem; color: var(--muted); font-weight: 600; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 12px; font-size: 0.85rem; font-weight: 600; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; }
.row2 .ghost { flex: 1 1 140px; min-height: 44px; }

.toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
  max-width: min(520px, calc(100% - 32px));
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--ink);
  color: var(--bg);
  padding: 11px 14px;
  border-radius: 12px;
  font-size: 0.9rem;
}
.toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 4px; }

.login { max-width: 400px; margin: 10vh auto 0; display: flex; flex-direction: column; gap: 14px; }
.login .box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.login .ok { margin: 0; color: var(--accent); font-size: 0.85rem; font-weight: 600; }
.foot { flex-direction: column; align-items: center; gap: 8px; }
.foot .row2 { justify-content: center; }
#boot { max-width: 560px; margin: 0 auto; }

.hb { display: flex; gap: 6px; flex: none; }
.top { flex-direction: column; align-items: stretch; }
.top .hb { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tools .ghost { min-height: 44px; font-size: 0.9rem; }
td.lm { font-style: italic; color: var(--muted); }
details.imp { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
details.imp summary { display: flex; justify-content: space-between; gap: 8px; padding: 11px 12px; cursor: pointer; font-weight: 700; list-style: none; }
details.imp summary::-webkit-details-marker { display: none; }
details.imp[open] summary { background: var(--surface2); }
details.imp summary small { color: var(--muted); font-weight: 600; white-space: nowrap; }
.irow { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 0.85rem; }
.irow input { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
.irow .in { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.irow .ia { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.78rem; text-align: right; white-space: nowrap; }
.irow.dup .in { color: var(--muted); }
.tag { display: block; font-size: 0.72rem; color: var(--muted); }
.tag.bad { color: var(--bad); }
.opt { display: flex; gap: 10px; align-items: flex-start; font-size: 0.88rem; }
.opt input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin-top: 1px; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.tab { border: 0; background: transparent; min-height: 42px; border-radius: 10px; font-weight: 700; color: var(--muted); }
.tab.on { background: var(--accent); color: var(--accent-ink); }
.wnav { display: grid; grid-template-columns: 44px 1fr 44px auto; gap: 6px; align-items: center; }
.wnav .ghost { min-height: 40px; }
.wlab { text-align: center; font-weight: 700; font-size: 0.9rem; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 6px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.68rem; color: var(--muted); font-weight: 600; min-width: 0; }
.wd b { font-family: var(--font-display); font-size: 1.05rem; color: var(--ink); }
.wd.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.wd.today b { color: var(--accent); }
.dot { min-width: 20px; height: 18px; border-radius: 9px; font-size: 0.68rem; font-weight: 700; font-style: normal; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; }
.dot.ok { background: var(--good); color: #fff; }
.dot.bad { background: var(--bad); color: #fff; }
.dot.none { background: var(--surface2); color: var(--muted); }
.dh { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; margin: 4px 0 0; }
.srow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
.srow.tap { cursor: pointer; }
.srow .t { min-width: 0; flex: 1; }
.srow b { display: block; font-size: 0.92rem; overflow-wrap: anywhere; }
.srow small { color: var(--muted); }
.srow .ghost.bad { color: var(--bad); border-color: var(--bad); }
.srow .ghost.ok { color: var(--good); border-color: var(--good); }
.sq { border-top: 1px solid var(--line); }
.sqh { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px 6px; }
.sqh b { font-family: var(--font-display); font-size: 1.02rem; }
.mem { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 6px; }
.mem span { background: var(--surface2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 0.82rem; font-weight: 600; }
.sq .srow { padding-block: 5px; }
.pick { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 11px 12px; font-weight: 700; }
.pick small { display: block; color: var(--muted); font-weight: 500; }
.dgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dbtn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; min-height: 38px; font-weight: 700; font-size: 0.76rem; color: var(--muted); padding: 0; }
.dbtn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.drow { display: flex; flex-direction: column; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); }
.drow b { font-size: 0.9rem; overflow-wrap: anywhere; }
.drow small { color: var(--muted); }
.field textarea { font-size: 16px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); width: 100%; resize: vertical; }
.irow b { display: block; font-size: 0.88rem; }

@media (min-width: 430px) {
  col.c-n { width: 64px; }
  td { font-size: 0.9rem; }
}
</style>
</head>
<body>

<p class="note" id="boot">Un momento...</p>
<section class="login" id="login" hidden>
  <div>
    <h1>Appalti pulizie</h1>
    <p class="sub">Accedi per vedere gli appalti e i conti.</p>
  </div>
  <form class="box" id="loginForm" novalidate>
    <div class="field"><label for="l-email">Email</label><input id="l-email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false"></div>
    <div class="field"><label for="l-pass">Password</label><input id="l-pass" type="password" autocomplete="current-password"></div>
    <p id="login-err" class="err" role="alert"></p>
    <button class="btn block" type="submit" id="loginBtn">Accedi</button>
    <button class="ghost block" type="button" id="resetBtn">Password dimenticata?</button>
  </form>
</section>

<main class="wrap" id="app" hidden>
  <div class="top">
    <div>
      <h1>Appalti pulizie</h1>
      <p class="sub" id="subTxt">Importi mensili in euro. Tocca un appalto o i suoi importi per modificarli.</p>
    </div>
    <div class="hb" id="topbtns"><button class="btn" type="button" data-act="add-condo" data-cleaner="" id="addCondoBtn">+ Appalto</button><button class="btn" type="button" data-act="add-cleaner" id="addCleanerBtn">+ Pulitore</button></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Pagine"><button type="button" class="tab on" data-act="page" data-p="app">Appalti</button><button type="button" class="tab" data-act="page" data-p="prog">Programma</button></nav>
  <div id="root" class="wrap" style="gap:14px"></div>
</main>
<div id="sheetRoot"></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="xlsFile" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAKfAf1nJbqLwFDXKUFDd5zXMNNtuhOMmw",
  authDomain: "appalri-pulizie.firebaseapp.com",
  projectId: "appalri-pulizie",
  storageBucket: "appalri-pulizie.firebasestorage.app",
  messagingSenderId: "271004282884",
  appId: "1:271004282884:web:de1dcab69c2253527a0551"
};

(function () {
  'use strict';
  var root = document.getElementById('root');
  var sheetRoot = document.getElementById('sheetRoot');
  var toastEl = document.getElementById('toast');
  var db = null, auth = null;
  var state = { cleaners: [], condomini: [], assenze: [], programma: [], c: false, k: false, pa: false, pp: false, perr: false, slow: false, denied: false, local: false, wipeArm: false, user: '', det: false, page: savedPage(), date: dstr(new Date()) };
  var sheet = null;
  function savedPage() { try { return localStorage.getItem('appalti.page') === 'prog' ? 'prog' : 'app'; } catch (e) { return 'app'; } }
  var toastTimer = null;

  var nf0 = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 0 });
  var nf2 = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function round2(n) { return Math.round(n * 100) / 100; }
  function fmt(n) {
    n = round2(n);
    var a = Math.abs(n);
    var s = Number.isInteger(a) ? nf0.format(a) : nf2.format(a);
    return (n < 0 ? '−' : '') + s;
  }
  function eur(n) { return fmt(n) + ' €'; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function parseMoney(s) {
    s = String(s || '').replace(/[€\s]/g, '');
    if (s === '') return 0;
    if (s.indexOf(',') > -1) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    var n = Number(s);
    if (!isFinite(n) || n < 0) return NaN;
    return round2(n);
  }
  function toInput(n) { return n ? String(n).replace('.', ',') : ''; }
  function newId() { return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function byName(a, b) { return a.nome.localeCompare(b.nome, 'it', { numeric: true }); }
  function find(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }

  /* ---------- Dati: db se disponibile, altrimenti solo in memoria ---------- */
  function listFor(col) { return state[col]; }
  function put(col, id, data) {
    if (db) return db.collection(col).doc(id).set(data);
    var list = listFor(col), o = { id: id }, k;
    for (k in data) o[k] = data[k];
    if (col === 'condomini' && (o.lordo === undefined || o.lordo === null)) { o.lm = true; o.lordo = o.stipendio || 0; }
    var cur = find(list, id);
    if (cur) list[list.indexOf(cur)] = o; else list.push(o);
    render();
    return Promise.resolve();
  }
  function patch(col, id, data) {
    if (db) return db.collection(col).doc(id).update(data);
    var cur = find(listFor(col), id), k;
    if (cur) for (k in data) cur[k] = data[k];
    render();
    return Promise.resolve();
  }
  function del(col, id) {
    if (db) return db.collection(col).doc(id).delete();
    var list = listFor(col), cur = find(list, id);

  function lordoVal(s) {

  function saveSheet() {
    if (!sheet) return;
    if (sheet.type === 'import') { doImport(); return; }
    if (sheet.type === 'abs') { saveAbs(); return; }
    if (sheet.type === 'squad') { saveSquad(); return; }
    if (sheet.type === 'sqscale') { saveSqScale(); return; }
    if (sheet.type === 'jolly') { saveJolly(); return; }
    if (sheet.type !== 'condo' && sheet.type !== 'cleaner') return;
    var nome = val('f-nome').trim();
    if (sheet.type === 'cleaner') {
      if (!nome) { setErr('Scrivi il nome del pulitore.'); return; }
      var jl = !!(document.getElementById('f-jolly') || {}).checked;
      var p = sheet.id ? patch('cleaners', sheet.id, { nome: nome, jolly: jl }) : put('cleaners', newId(), { nome: nome, ordine: Date.now(), jolly: jl });
      closeSheet();
      guard(p);
      return;
    }
    var r = parseMoney(val('f-ric')), s = parseMoney(val('f-stip')), l = lordoVal(s);
    if (!nome) { setErr('Scrivi il nome dell\u2019appalto.'); return; }
    if (isNaN(r) || isNaN(s) || isNaN(l)) { setErr('Gli importi vanno scritti come numeri, per esempio 450 oppure 450,50.'); return; }
    var data = { nome: nome, ricavo: r, stipendio: s, lordo: l, cleanerId: val('f-assign'), giorni: readDays() };
    var q = sheet.id ? patch('condomini', sheet.id, data) : put('condomini', newId(), data);
    var nextId = null;
    if (sheet.id && sheet.next) {
      var cur = find(state.condomini, sheet.id);
      var sib = (cur && cur.cleanerId && find(state.cleaners, cur.cleanerId)) ? condoOf(cur.cleanerId) : unassigned();
      for (var si = 0; si < sib.length; si++) if (sib[si].id === sheet.id && sib[si + 1]) nextId = sib[si + 1].id;
    }
    closeSheet();
    guard(q);
    if (nextId) openCondo(nextId, null);
  }

  /* ---------- Lettura di un file Excel (.xlsx) direttamente sul dispositivo ---------- */
  function utf8(u8) { return new TextDecoder('utf-8').decode(u8); }
  async function inflate(u8) {

  function readZip(buf) {

    if (u8.length < 22 || u8[0] !== 0x50 || u8[1] !== 0x4B) throw new Error('nozip');
    for (i = u8.length - 22; i >= Math.max(0, u8.length - 65600); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { found = i; break; }

      var nl = dv.getUint16(off + 28, true), el = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true);
      files[utf8(u8.subarray(off + 46, off + 46 + nl))] = { m: dv.getUint16(off + 10, true), cs: dv.getUint32(off + 20, true), lh: dv.getUint32(off + 42, true) };
      off += 46 + nl + el + cl;
    }
    return {
      text: async function (name) {
        var f = files[name];
        if (!f) return null;
        var nl2 = dv.getUint16(f.lh + 26, true), el2 = dv.getUint16(f.lh + 28, true), st = f.lh + 30 + nl2 + el2;

  }
  function xml(s) {

  }
  function each(list, fn) { Array.prototype.forEach.call(list, fn); }
  function parseSheet(d, shared) {

    for (i = 0; i < rs.length; i++) {
      var rn = Number(rs[i].getAttribute('r')) || (i + 1);

        if (t === 'inlineStr') {

        } else if (ve) {
          var raw = ve.textContent;
          if (t === 's') v = shared[Number(raw)];
          else if (t === 'str') v = raw;
          else if (t === 'b' || t === 'e') v = null;
          else { v = Number(raw); if (!isFinite(v)) v = null; }
        }
        if (v !== null && v !== undefined && v !== '') row[m[1]] = v;

      rows[rn] = row;
    }
    return rows;
  }
  async function readXlsx(buf) {
    var z = readZip(buf);
    var wbT = await z.text('xl/workbook.xml');
    if (wbT === null) throw new Error('nozip');
    var wb = xml(wbT), rels = {}, shared = [], out = [];
    var relsT = await z.text('xl/_rels/workbook.xml.rels');
    if (relsT) each(xml(relsT).getElementsByTagNameNS('*', 'Relationship'), function (r) { rels[r.getAttribute('Id')] = r.getAttribute('Target'); });
    var ssT = await z.text('xl/sharedStrings.xml');
    if (ssT) each(xml(ssT).getElementsByTagNameNS('*', 'si'), function (si) {
      var t = '';
      each(si.getElementsByTagNameNS('*', 't'), function (x) { if (x.parentNode.localName !== 'rPh') t += x.textContent; });
      shared.push(t);
    });
    var sheets = wb.getElementsByTagNameNS('*', 'sheet'), i;
    for (i = 0; i < sheets.length; i++) {
      var sh = sheets[i], stt = sh.getAttribute('state');
      if (stt === 'hidden' || stt === 'veryHidden') continue;
      var rid = sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id') || sh.getAttribute('r:id');
      var tg = rels[rid];
      if (!tg) continue;
      var sx = await z.text(tg.charAt(0) === '/' ? tg.slice(1) : 'xl/' + tg);
      if (sx === null) continue;
      out.push({ name: sh.getAttribute('name') || '', rows: parseSheet(xml(sx), shared) });
    }

  }

  function cellNum(v) {

  // Un foglio per pulitore: nome in D2, tabella con intestazione "APPALTO" in colonna C, ricavo in D, stipendio netto in F.
  function extractFromSheets(sheets) {
    var res = { cleaners: [], ignored: [] };
    sheets.forEach(function (sh) {
      var rows = sh.rows, hdr = 0, r;
      for (r = 1; r <= 15; r++) if (rows[r] && /^appalt/i.test(cellText(rows[r].C))) { hdr = r; break; }
      var fallback = !hdr;
      if (!hdr) hdr = 6;
      var unas = /assegnar/i.test(sh.name);
      var name = cellText(rows[2] && rows[2].D) || sh.name;
      var list = [];
      for (r = hdr + 1; r <= hdr + 300; r++) {
        var row = rows[r];
        if (!row) continue;
        var nome = cellText(row.C);
        if (!nome || /^total/i.test(nome)) continue;
        var ric = cellNum(row.D), net = cellNum(row.F);
        if (fallback && ric === null && net === null) continue;
        list.push({ nome: nome, ricavo: ric === null ? 0 : ric, stipendio: net === null ? 0 : net, none: ric === null && net === null, part: (ric === null) !== (net === null) });
      }
      if (!list.length) { res.ignored.push(sh.name); return; }
      res.cleaners.push({ nome: unas ? 'Non assegnati' : name, unassigned: unas, condos: list });
    });

  }

  function cleanerByName(nome) {

    return null;

  }

  function importSheetHtml(d) {

  function loadXlsx(file) {

      if (!d.cleaners.length) { showToast('Non ho trovato appalti in questo file.', null, null, 8000); return; }

  function withTimeout(p, ms) {

      function next() {

        var j = jobs[i++];

        withTimeout(p, 8000).then(function (r) {
          res[r]++; fin++;
          onProg(fin, jobs.length);
          if (fin === jobs.length) resolve(res); else next();
        });
      }
      for (var w = 0; w < 6 && w < jobs.length; w++) next();
    });
  }

  function doImport() {
    var d = sheet.data, upd = !!(document.getElementById('imp-upd') || {}).checked, picked = {};
    each(document.querySelectorAll('[data-imp]'), function (el) { if (el.checked) picked[el.getAttribute('data-imp')] = true; });
    var jobs = [], seen = {}, newByName = {}, st = { added: 0, upd: 0, skip: 0, cl: 0 }, base = Date.now();
    d.cleaners.forEach(function (c, ci) {
      var chosen = c.condos.filter(function (k, ki) { return picked[ci + ':' + ki]; });
      if (!chosen.length) return;
      var cid = '';
      if (!c.unassigned) {
        var ex = cleanerByName(c.nome), nn = norm(c.nome);
        if (ex) cid = ex.id;
        else if (newByName[nn]) cid = newByName[nn];
        else { cid = newId(); newByName[nn] = cid; st.cl++; jobs.push({ op: 'put', col: 'cleaners', id: cid, data: { nome: c.nome, ordine: base + ci } }); }
      }
      chosen.forEach(function (k) {
        var key = cid + '|' + norm(k.nome), ex2 = condoExists(cid, k.nome);

    });

    if (!jobs.length) { showToast('Niente da importare: ' + (st.skip ? 'le righe scelte erano già presenti.' : 'non hai spuntato nessuna riga.'), null, null, 8000); return; }
    runJobs(jobs, function (n, tot) { showToast('Importo… ' + n + ' di ' + tot, null, null, 20000); }).then(function (r) {
      var msg = 'Importati ' + st.added + (st.added === 1 ? ' appalto' : ' appalti') + (st.cl ? ' e ' + st.cl + (st.cl === 1 ? ' pulitore nuovo' : ' pulitori nuovi') : '') + '.';
      if (st.upd) msg += ' Aggiornati ' + st.upd + '.';
      if (st.skip) msg += ' Saltati ' + st.skip + ' già presenti.';
      if (r.fail) msg += ' ' + r.fail + ' non salvati: riprova.';

    });

  function pdfClean(s) {

  function PdfDoc() {

  function makeReport(cleanerId) {

    } else {
      state.cleaners.forEach(function (c) { var l = condoOf(c.id); if (!(c.jolly && !l.length)) groups.push({ c: c, list: l }); });

  function slug(s) { return norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'pulitore'; }
  function makePdf(cleanerId) {
    var rep;

    var iso = new Date().toISOString().slice(0, 10);
    var name = cleanerId ? 'Appalti_' + slug(rep.title) + '_' + iso + '.pdf' : 'Appalti_riepilogo_' + iso + '.pdf';
    saveFile(rep.bytes, name, rep.title + ' - Appalti pulizie');
  }
  function isTouch() {

  }
  function downloadFile(bytes, name) {
    var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    showToast('PDF pronto: lo trovi nei download del telefono.', null, null, 5000);
  }
  // Sul telefono apre il menu Condividi (WhatsApp, email, Salva nei file...): il PDF resta un vero file.
  function saveFile(bytes, name, title) {

    if (file && isTouch() && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: title }).catch(function (err) { if (!err || err.name !== 'AbortError') downloadFile(bytes, name); });

  }

  /* ---------- Programma: giorni, assenze, squadre ---------- */
  var DOWS = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];
  var DOWL = ['lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato', 'domenica'];
  var MONS = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
  var MONS3 = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
  function z2(n) { return (n < 10 ? '0' : '') + n; }
  function dstr(d) { return d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate()); }
  function pdate(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); }
  function addDays(s, n) { var d = pdate(s); d.setDate(d.getDate() + n); return dstr(d); }
  function isoDow(s) { return (pdate(s).getDay() + 6) % 7 + 1; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function longDate(s) { var d = pdate(s); return DOWL[isoDow(s) - 1] + ' ' + d.getDate() + ' ' + MONS[d.getMonth()]; }
  function shortDate(s) { var d = pdate(s); return d.getDate() + '/' + (d.getMonth() + 1); }
  function weekStart(s) { return addDays(s, 1 - isoDow(s)); }
  function weekLabel(ws) {
    var a = pdate(ws), b = pdate(addDays(ws, 6));
    return a.getDate() + ' ' + MONS3[a.getMonth()] + ' – ' + b.getDate() + ' ' + MONS3[b.getMonth()];
  }
  function giorniText(a) { return a.slice().sort().map(function (n) { return DOWS[n - 1]; }).join(' · '); }
  function cname(id) { var c = find(state.cleaners, id); return c ? c.nome : ''; }
  function arr(v) { return Array.isArray(v) ? v.map(String) : []; }

  function mapAssenza(d) {
    var o = d.data() || {};
    return { id: d.id, cleanerId: String(o.cleanerId || ''), dal: String(o.dal || ''), al: String(o.al || o.dal || ''), tipo: o.tipo === 'malattia' ? 'malattia' : 'assenza' };
  }
  function mapDay(d) {
    var o = d.data() || {};
    var sq = Array.isArray(o.squadre) ? o.squadre : [];
    return {
      id: d.id,
      squadre: sq.map(function (s) { s = s || {}; return { id: String(s.id || ''), membri: arr(s.membri), appalti: arr(s.appalti) }; }),
      extra: arr(o.extra), saltati: arr(o.saltati)

  }
  function dayDoc(ds) { return find(state.programma, ds) || { id: ds, squadre: [], extra: [], saltati: [] }; }
  function cloneDay(ds) {
    var p = dayDoc(ds);
    return {
      squadre: p.squadre.map(function (s) { return { id: s.id, membri: s.membri.slice(), appalti: s.appalti.slice() }; }),
      extra: p.extra.slice(), saltati: p.saltati.slice()
    };
  }
  function absenceOf(cid, ds) {
    for (var i = 0; i < state.assenze.length; i++) {
      var a = state.assenze[i];
      if (a.cleanerId === cid && a.dal <= ds && ds <= a.al) return a;
    }

  }
  function squadOf(day, kid) {
    for (var i = 0; i < day.squadre.length; i++) {
      var s = day.squadre[i];

    }
    return null;
  }
  function dayInfo(ds) {
    var day = dayDoc(ds), wd = isoDow(ds), rows = [];
    state.condomini.forEach(function (k) {
      var planned = k.giorni.indexOf(wd) > -1, extra = day.extra.indexOf(k.id) > -1;
      if (!planned && !extra) return;
      var t = k.cleanerId ? find(state.cleaners, k.cleanerId) : null;
      var ab = t ? absenceOf(t.id, ds) : null;
      rows.push({ k: k, t: t, ab: ab, sq: squadOf(day, k.id), skipped: day.saltati.indexOf(k.id) > -1, extra: extra && !planned, uncovered: !t || !!ab });
    });
    rows.sort(function (a, b) { return byName(a.k, b.k); });
    var active = rows.filter(function (r) { return !r.skipped; });
    var abs = state.assenze.filter(function (a) { return a.dal <= ds && ds <= a.al && find(state.cleaners, a.cleanerId); });
    return { day: day, rows: rows, active: active, open: active.filter(function (r) { return r.uncovered && !r.sq; }), abs: abs };

  function dayStatus(ds) {

  }
  function whyHtml(r) {

  function freeJolly(info, ds) {

    // Assenti
    h += '<section class="card"><div class="chead"><div><h2>Assenti</h2><p class="meta">' + (info.abs.length ? info.abs.length + ' in questo giorno' : 'Nessuno in questo giorno') + '</p></div></div>';

      (info.active.length ? (unc.length ? unc.length + (unc.length === 1 ? ' scoperta' : ' scoperte') + ', ' + info.open.length + ' da assegnare' : 'Tutto coperto') : 'Nessun appalto in programma') + '</p></div></div>';

      h += '<div class="srow"><div class="t"><b>' + esc(r.k.nome) + '</b><small>' + whyHtml(r) + '</small></div>' +

    info.day.squadre.forEach(function (s, si) {

      s.appalti.forEach(function (kid) {

  function saveAbs() {
    var cid = val('f-cl'), dal = val('f-dal'), al = val('f-al'), tipo = val('f-tipo') === 'malattia' ? 'malattia' : 'assenza';
    if (!cid) { setErr('Scegli chi è assente.'); return; }
    if (!dal || !al) { setErr('Indica le date.'); return; }
    if (al < dal) { setErr('La data finale è prima di quella iniziale.'); return; }
    var id = sheet.id || newId();
    closeSheet();
    var n = 0, chain = Promise.resolve(put('assenze', id, { cleanerId: cid, dal: dal, al: al, tipo: tipo }));
    state.programma.forEach(function (p) {
      if (p.id < dal || p.id > al) return;
      var d = cloneDay(p.id), ch = false;
      d.squadre.forEach(function (s) { var i = s.membri.indexOf(cid); if (i > -1) { s.membri.splice(i, 1); ch = true; } });

  function openSquad(sqId, pending) {

  function moveScala(d, kid, s) {

    if (s.appalti.indexOf(kid) < 0) s.appalti.push(kid);

  function saveSquad() {

    if (!s) { s = { id: newId(), membri: [], appalti: [] }; d.squadre.push(s); }

  function saveJolly() {
    var chain = Promise.resolve(), seen = {}, base = Date.now();

      if (cl && !!cl.jolly !== c.checked) chain = chain.then(function () { return patch('cleaners', cl.id, { jolly: c.checked }); });
    });

  /* --- testo e PDF del giorno --- */
  function dayData(ds) {
    var info = dayInfo(ds), squads = [];
    info.day.squadre.forEach(function (s, i) {
      squads.push({
        n: i + 1, nomi: s.membri.map(cname).filter(Boolean),
        scale: s.appalti.map(function (id) { var k = find(state.condomini, id); return k ? k.nome : ''; }).filter(Boolean)
      });
    });
    return {
      squads: squads,
      open: info.open.map(function (r) { return { nome: r.k.nome, why: r.ab ? r.t.nome + ' ' + (r.ab.tipo === 'malattia' ? 'in malattia' : 'assente') : 'non assegnato' }; }),
      abs: info.abs.map(function (a) { return { nome: cname(a.cleanerId), tipo: a.tipo }; }),
      total: info.active.length
    };
  }
  function dayText(ds) {
    var D = dayData(ds), L = ['Programma ' + longDate(ds), ''];
    D.squads.forEach(function (s) {
      L.push('Squadra ' + s.n + ': ' + (s.nomi.length ? s.nomi.join(', ') : '(nessuno)'));
      s.scale.forEach(function (x) { L.push('- ' + x); });
      L.push('');
    });
    if (D.open.length) { L.push('Ancora da assegnare:'); D.open.forEach(function (x) { L.push('- ' + x.nome); }); L.push(''); }
    if (D.abs.length) L.push('Assenti: ' + D.abs.map(function (a) { return a.nome + (a.tipo === 'malattia' ? ' (malattia)' : ''); }).join(', '));
    return L.join('\n').replace(/\n+$/, '');
  }
  function makeDayReport(ds) {
    var doc = PdfDoc(), y = 0, D = dayData(ds);
    function page() {
      doc.add();
      y = PM;
      doc.text(PM, y + 8, 'Programma squadre', { b: 1, s: 9, c: ACC });
      doc.text(PW - PM, y + 8, new Date().toLocaleDateString('it-IT'), { s: 9, c: MUTED, a: 'r' });
      doc.line(PM, y + 14, PW - PM, LINE, 0.6);
      y += 32;
    }
    function room(h) { if (y + h > PH - PM - 18) page(); }
    function head(txt, right, col) {
      room(70);
      doc.rect(PM, y, CW, 22, col || ACC);
      doc.text(PM + 8, y + 15, txt, { b: 1, s: 10.5, c: WHITE });
      if (right) doc.text(PW - PM - 8, y + 15, right, { s: 9, c: WHITE, a: 'r' });
      y += 22;
    }
    function item(txt, sub, col) {
      var lines = wrapText(txt, false, 10, CW - 30), h = lines.length * 13 + 9 + (sub ? 11 : 0);
      room(h);
      doc.rect(PM + 8, y + 6, 4, 4, col || ACC);
      lines.forEach(function (ln, i) { doc.text(PM + 20, y + 13 + i * 13, ln, { s: 10 }); });
      if (sub) doc.text(PM + 20, y + 11 + lines.length * 13, sub, { s: 8.5, c: MUTED });
      doc.line(PM, y + h, PM + CW, LINE, 0.4);
      y += h;
    }
    page();
    var title = cap(longDate(ds));
    doc.text(PM, y + 16, title, { b: 1, s: 22 });
    y += 24;
    doc.text(PM, y + 8, D.total + (D.total === 1 ? ' appalto in programma' : ' appalti in programma') + ' · ' + D.squads.length + (D.squads.length === 1 ? ' squadra' : ' squadre'), { s: 9.5, c: MUTED });
    y += 26;
    D.squads.forEach(function (s) {
      head('Squadra ' + s.n, s.scale.length + (s.scale.length === 1 ? ' scala' : ' scale'));
      var lines = wrapText('Persone: ' + (s.nomi.length ? s.nomi.join(', ') : 'nessuna'), true, 10, CW - 16), h = lines.length * 13 + 10;
      room(h);
      doc.rect(PM, y, CW, h, SOFT);
      lines.forEach(function (ln, i) { doc.text(PM + 8, y + 14 + i * 13, ln, { b: 1, s: 10 }); });
      y += h;
      if (!s.scale.length) item('Nessuna scala assegnata', '', MUTED);
      s.scale.forEach(function (x) { item(x); });
      y += 14;
    });
    if (D.open.length) {
      head('Ancora da assegnare', String(D.open.length), BAD);
      D.open.forEach(function (x) { item(x.nome, x.why, BAD); });
      y += 14;
    }
    if (D.abs.length) {
      head('Assenti', String(D.abs.length), MUTED);
      D.abs.forEach(function (a) { item(a.nome, a.tipo === 'malattia' ? 'Malattia' : 'Assenza', MUTED); });
      y += 14;
    }
    if (!D.squads.length && !D.open.length && !D.abs.length) doc.text(PM, y + 10, 'Nessuna squadra, scoperta o assenza per questo giorno.', { c: MUTED });
    var N = doc.count(), i;
    for (i = 0; i < N; i++) {
      doc.go(i);
      doc.text(PM, PH - 26, 'Documento riservato', { s: 8, c: MUTED });
      doc.text(PW - PM, PH - 26, 'Pagina ' + (i + 1) + ' di ' + N, { s: 8, c: MUTED, a: 'r' });
    }
    return doc.build('Programma ' + longDate(ds));
  }
  function makeDayPdf(ds) {
    var bytes;
    try { bytes = makeDayReport(ds); } catch (e) { bytes = null; }
    if (!bytes) { showToast('Non sono riuscito a creare il PDF.'); return; }
    saveFile(bytes, 'Programma_' + ds + '.pdf', 'Programma ' + longDate(ds));
  }
  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { showToast('Testo copiato: incollalo dove vuoi.'); }, function () { showToast('Non sono riuscito a copiare il testo.'); });
    } else {
      showToast('Non sono riuscito a copiare il testo.');
    }
  }
  function shareDayText(ds) {

      navigator.share({ text: txt }).catch(function (err) { if (!err || err.name !== 'AbortError') copyText(txt); });
      return;
    }
    copyText(txt);
  }

      ['Cond. Aurora (es.)', 700, 340, 480, 0], ['Cond. Bellavista (es.)', 520, 250, 350, 0], ['Cond. Colle Verde (es.)', 820, 400, 560, 0],
      ['Cond. Dante (es.)', 600, 300, 420, 1], ['Cond. Europa (es.)', 420, 190, 270, 1], ['Cond. Fiori (es.)', 560, 260, 365, -1]
    ];

    state.condomini.slice().forEach(function (k) { chain = chain.then(function () { return del('condomini', k.id); }); });
    state.cleaners.slice().forEach(function (c) { chain = chain.then(function () { return del('cleaners', c.id); }); });
    state.assenze.slice().forEach(function (a) { chain = chain.then(function () { return del('assenze', a.id); }); });

  function handle(act, el) {
    var id = el.getAttribute('data-id');
    if (act !== 'wipe' && state.wipeArm) { state.wipeArm = false; render(); }
    switch (act) {
      case 'add-cleaner': openCleaner(null); break;
      case 'edit-cleaner': openCleaner(id); break;
      case 'add-condo': openCondo(null, el.getAttribute('data-cleaner')); break;
      case 'edit-condo': openCondo(id, null); break;
      case 'unassign': unassignWithUndo(id); break;
      case 'logout': if (auth) signOut(auth); break;
      case 'close': closeSheet(); break;
      case 'seed': seedExample(); break;
      case 'save-next': if (sheet) { sheet.next = true; saveSheet(); } break;
      case 'import': document.getElementById('xlsFile').click(); break;
      case 'pdf-all': makePdf(null); break;
      case 'page':
        state.page = el.getAttribute('data-p') === 'prog' ? 'prog' : 'app';
        try { localStorage.setItem('appalti.page', state.page); } catch (e) {}
        render(); window.scrollTo(0, 0);
        break;
      case 'wk': state.date = addDays(state.date, +el.getAttribute('data-n')); render(); break;
      case 'today': state.date = dstr(new Date()); render(); break;
      case 'day': state.date = el.getAttribute('data-date'); render(); break;
      case 'add-abs': openAbs(null); break;
      case 'edit-abs': openAbs(id); break;
      case 'del-abs':
        if (!sheet || !sheet.id) break;
        if (!sheet.arm) { sheet.arm = true; el.textContent = 'Tocca ancora per eliminare'; break; }
        var aid = sheet.id; closeSheet(); guard(del('assenze', aid));
        break;
      case 'new-sq': openSquad(null, null); break;
      case 'edit-sq': openSquad(id, null); break;
      case 'del-sq':
        if (!sheet || !sheet.id) break;
        if (!sheet.arm) { sheet.arm = true; el.textContent = 'Tocca ancora: le sue scale tornano da assegnare'; break; }
        var dsq = sheet.id, dd = cloneDay(state.date);
        dd.squadre = dd.squadre.filter(function (x) { return x.id !== dsq; });
        closeSheet(); guard(put('programma', state.date, dd));
        break;
      case 'sq-add': openSqScale(id); break;
      case 'sq-remove': removeFromSquads(id, el.getAttribute('data-sq')); break;
      case 'assign': openAssign(id); break;
      case 'assign-sq': assignTo(id, el.getAttribute('data-sq')); break;
      case 'assign-new': closeSheet(); openSquad(null, id); break;
      case 'assign-none': closeSheet(); removeFromSquads(id, null); break;
      case 'skip': closeSheet(); toggleSkip(id); break;
      case 'extra': openExtra(); break;
      case 'addextra':
        var de = cloneDay(state.date);
        if (de.extra.indexOf(id) < 0) de.extra.push(id);
        closeSheet(); guard(put('programma', state.date, de));
        break;
      case 'jolly': openJolly(); break;
      case 'days': openDays(el.getAttribute('data-only') === '1'); break;
      case 'days-filter': openDays(el.getAttribute('data-only') === '1'); break;
      case 'tg':
        el.classList.toggle('on');
        var gl = [];
        each(el.closest('.drow').querySelectorAll('.dbtn.on'), function (b) { gl.push(+b.getAttribute('data-d')); });
        guard(patch('condomini', id, { giorni: gl }));
        break;
      case 'tgf': el.classList.toggle('on'); break;
      case 'prog-pdf': makeDayPdf(state.date); break;
      case 'prog-text': shareDayText(state.date); break;
      case 'pdf-cleaner': makePdf(id); break;
      case 'wipe':
        if (!state.wipeArm) { state.wipeArm = true; render(); setTimeout(function () { if (state.wipeArm) { state.wipeArm = false; render(); } }, 5000); }
        else { state.wipeArm = false; render(); wipeAll(); }
        break;
      case 'pick':
        var target = id, cid = null;
        var cur = document.getElementById('f-assign');
        cid = cur ? cur.value : '';
        closeSheet();
        guard(patch('condomini', target, { cleanerId: cid }));
        break;
      case 'unassign-sheet':
        if (sheet && sheet.id) { var kid = sheet.id; closeSheet(); unassignWithUndo(kid); }
        break;
      case 'del-condo':
        if (!sheet || !sheet.id) break;
        if (!sheet.arm) { sheet.arm = true; el.textContent = 'Tocca ancora per eliminare'; break; }
        var did = sheet.id; closeSheet(); guard(del('condomini', did));
        break;

        if (!sheet.arm) {

          var n = condoOf(sheet.id).length;
          el.textContent = n ? 'Tocca ancora: i suoi ' + n + ' appalti passano in Non assegnati' : 'Tocca ancora per eliminare';
          break;

        var cidDel = sheet.id;
        var moved = condoOf(cidDel);
        closeSheet();
        var chain = Promise.resolve();
        moved.forEach(function (k) { chain = chain.then(function () { return patch('condomini', k.id, { cleanerId: '' }); }); });
        state.assenze.filter(function (a) { return a.cleanerId === cidDel; }).forEach(function (a) { chain = chain.then(function () { return del('assenze', a.id); }); });
        chain = chain.then(function () { return del('cleaners', cidDel); });
        guard(chain);
        break;
    }
  }

  root.addEventListener('toggle', function (e) { if (e.target && e.target.id === 'allDet') state.det = e.target.open; }, true);

  /* ---------- Accesso e avvio ---------- */
  var bootEl = document.getElementById('boot');
  var loginEl = document.getElementById('login');
  var appEl = document.getElementById('app');
  var loginForm = document.getElementById('loginForm');
  var loginErr = document.getElementById('login-err');
  var loginBtn = document.getElementById('loginBtn');
  var unsubs = [];
  var slowTimer = null;

  function makeDb(fsdb) {
    return {
      collection: function (c) {
        var cref = collection(fsdb, c);
        return {
          doc: function (id) {
            var dref = doc(fsdb, c, id);
            return {
              set: function (d) { return setDoc(dref, d); },
              update: function (d) { return updateDoc(dref, d); },
              delete: function () { return deleteDoc(dref); }
            };
          },
          onSnapshot: function (next, err) {
            return onSnapshot(cref, function (snap) {
              next({ docs: snap.docs.map(function (d) { return { id: d.id, data: function () { return d.data(); } }; }) });
            }, err);
          }
        };
      }
    };
  }

  function setLoginMsg(msg, good) { loginErr.textContent = msg || ''; loginErr.className = good ? 'ok' : 'err'; }
  function authMsg(err) {
    var c = err && err.code;
    if (c === 'auth/network-request-failed') return 'Nessuna connessione. Riprova.';
    if (c === 'auth/too-many-requests') return 'Troppi tentativi. Riprova tra qualche minuto.';
    if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-email' || c === 'auth/missing-password') return 'Email o password non corrette.';
    return 'Accesso non riuscito. Riprova.';
  }
  function showLogin() { bootEl.hidden = true; appEl.hidden = true; loginEl.hidden = false; closeSheet(); }
  function showApp() { bootEl.hidden = true; loginEl.hidden = true; appEl.hidden = false; }

  function stopData() {
    unsubs.forEach(function (u) { try { u(); } catch (e) {} });
    unsubs = [];
    clearTimeout(slowTimer);
    state.cleaners = []; state.condomini = []; state.assenze = []; state.programma = [];
    state.pa = false; state.pp = false; state.perr = false;
    state.c = false; state.k = false; state.slow = false; state.denied = false; state.wipeArm = false;
  }

  function startData() {
    stopData();
    render();
    slowTimer = setTimeout(function () { if (!(state.c && state.k)) { state.slow = true; render(); } }, 10000);
    function fail(err) {
      if (err && err.code === 'permission-denied') state.denied = true; else state.slow = true;
      render();
    }
    function done() { if (state.c && state.k) clearTimeout(slowTimer); }
    unsubs.push(db.collection('cleaners').onSnapshot(function (snap) {
      state.cleaners = snap.docs.map(mapCleaner).sort(function (a, b) { return a.ordine - b.ordine; });
      state.c = true; done(); render();
    }, fail));
    unsubs.push(db.collection('condomini').onSnapshot(function (snap) {
      state.condomini = snap.docs.map(mapCondo);
      state.k = true; done(); render();
    }, fail));
    function failP() { state.perr = true; render(); }
    unsubs.push(db.collection('assenze').onSnapshot(function (snap) {
      state.assenze = snap.docs.map(mapAssenza);
      state.pa = true; render();
    }, failP));
    unsubs.push(db.collection('programma').onSnapshot(function (snap) {
      state.programma = snap.docs.map(mapDay);
      state.pp = true; render();
    }, failP));
  }

  var cfg = firebaseConfig;
  if (!cfg || !cfg.apiKey || String(cfg.apiKey).indexOf('INSERISCI') === 0) {
    showLogin();
    setLoginMsg('Configurazione di Firebase mancante.');
    loginBtn.disabled = true;
  } else {
    var fapp = initializeApp(cfg);
    auth = getAuth(fapp);
    var fsdb;
    try {
      fsdb = initializeFirestore(fapp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
    } catch (e) {
      fsdb = getFirestore(fapp);
    }
    db = makeDb(fsdb);

    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();
      var em = document.getElementById('l-email').value.trim().toLowerCase();
      var pw = document.getElementById('l-pass').value;
      if (!em || !pw) { setLoginMsg('Scrivi email e password.'); return; }
      loginBtn.disabled = true;
      setLoginMsg('');
      signInWithEmailAndPassword(auth, em, pw).catch(function (err) {
        setLoginMsg(authMsg(err));
      }).then(function () { loginBtn.disabled = false; });
    });
    document.getElementById('resetBtn').addEventListener('click', function () {
      var em = document.getElementById('l-email').value.trim().toLowerCase();
      if (!em) { setLoginMsg('Scrivi la tua email, poi tocca di nuovo.'); return; }
      sendPasswordResetEmail(auth, em).then(function () {
        setLoginMsg('Se l’email è abilitata, ti arriva un messaggio per scegliere una nuova password.', true);
      }, function (err) { setLoginMsg(authMsg(err)); });
    });

    onAuthStateChanged(auth, function (user) {
      if (user) {
        state.user = user.email || '';
        showApp();
        startData();
      } else {
        stopData();
        state.user = '';
        document.getElementById('l-pass').value = '';
        showLogin();
      }
    });
  }
})();
</script>
<script>
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
